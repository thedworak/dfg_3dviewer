# ---------------------------------------------------------------------------
# <MAIN_DOMAIN>  ->  Drupal (PHP-FPM), the site hosting the dfg_3dviewer
# module (ConvertWorker, DFG3dViewerConfigForm, etc.). Standard Drupal
# 10/11 nginx recipe - `root` and `fastcgi_pass` are placeholders, adjust
# them to your actual installation.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name <MAIN_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <MAIN_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<MAIN_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<MAIN_DOMAIN>/privkey.pem;

    root /var/www/drupal/web;  # <-- adjust: your Drupal docroot
    index index.php;

    # Large 3D model uploads - see README.md's "Minimal Requirements" and
    # ConvertProcessService's own handling.
    client_max_body_size 500M;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # Deny access to sensitive/source files (standard Drupal hardening).
    location ~ '\.(engine|inc|install|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$' {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }

    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # <-- adjust: your PHP-FPM socket/address
    }

    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    location ~ ^/(sites/default/files|modules|libraries|themes)/.*\.(js|css|gif|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri @rewrite;
        access_log off;
        expires 30d;
    }
}
