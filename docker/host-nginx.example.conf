# Example HOST-level nginx config - runs directly on the server (outside
# Docker), terminating HTTPS and reverse-proxying to the containers started
# by `docker compose up` (see docker-compose.yml) and to Drupal.
#
# This is NOT the same file as docker/nginx.conf: that one runs *inside*
# each viewer container and reverse-proxies /api/ and /files/ to the worker
# over the Docker network. This file sits in front of all of that, exposed
# to the public internet under real (sub)domains.
#
# Before using:
#   1. Replace every "<MAIN_DOMAIN>" below with your real domain
#      (e.g. dfg-viewer.example.org).
#   2. Point test./dev./sandbox.<MAIN_DOMAIN> DNS records at this server.
#   3. Adjust the Drupal server block's `root` and `fastcgi_pass` to match
#      your actual Drupal installation - those two lines are the standard
#      Drupal 10/11 nginx recipe, not generated from your specific setup,
#      since this repo doesn't know your docroot path or PHP-FPM socket.
#   4. Copy this file into /etc/nginx/sites-available/, symlink it into
#      sites-enabled/, then obtain certificates, e.g.:
#        sudo certbot --nginx -d <MAIN_DOMAIN> -d test.<MAIN_DOMAIN> \
#          -d dev.<MAIN_DOMAIN> -d sandbox.<MAIN_DOMAIN>
#      (certbot's --nginx plugin can rewrite the "listen 443"/
#      ssl_certificate lines itself - the paths below already match its
#      default output naming either way.)
#   5. `sudo nginx -t` before `sudo systemctl reload nginx` - this file
#      hasn't been syntax-checked against a real nginx install.
#
# The worker's own :8080 API is deliberately NOT exposed here - each
# viewer's own container-internal nginx (docker/nginx.conf) already
# reverse-proxies /api/ and /files/ to it, which is all any of these
# frontends need. Note that docker-compose.yml still publishes :8080
# directly on the host's network interface ("8080:8080"), so it stays
# reachable from the public internet on that port regardless of this file
# unless you also bind it to loopback only - add this to
# docker-compose.override.yml (see docker-compose.override.example.yml) if
# you want that:
#
#   services:
#     worker:
#       ports: !override
#         - "127.0.0.1:8080:8080"

# ---------------------------------------------------------------------------
# test.<MAIN_DOMAIN>  ->  viewer-test (docker-compose.yml, published on :3000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name test.<MAIN_DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name test.<MAIN_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/test.<MAIN_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.<MAIN_DOMAIN>/privkey.pem;

    # Matches WORKER_MAX_UPLOAD_BYTES's default (500 MB) - see
    # worker/README.md's configuration table. Raise both together if you
    # raise that env var.
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

