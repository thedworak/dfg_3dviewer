# Local copy of the worker's /files/ (converted models, thumbnails): a
# Cloudflare miss - every edge location misses once - is served from here
# instead of the worker reading the whole file again. Each viewer container
# keeps its own; lost when the container is recreated.
proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=files:10m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's mime.types has no glTF: examples/*.glb would go out as
    # application/octet-stream. A server-level `types` replaces the inherited
    # map, hence mime.types again first; the two blocks merge.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    # Compresses origin -> Cloudflare traffic too (Cloudflare re-compresses
    # for visitors as it likes). Models are binary or already compressed
    # (Draco, LAZ) and stay as they are.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/wasm
               image/svg+xml text/plain text/xml application/xml;

    # Resolve the worker through Docker's embedded DNS at request time instead
    # of once at startup: a static `proxy_pass http://worker:8080` makes nginx
    # refuse to start ("host not found in upstream") whenever the worker
    # container is down or restarting. With a variable the viewer still
    # serves and only /api/ and /files/ answer 502 until the worker is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $worker_upstream http://worker:8080;

    # Proxied to the worker container by Docker Compose's service-name DNS
    # (see docker-compose.yml) - same-origin so viewer/status-poller.js and
    # viewer/ui/upload-panel.js can use plain relative fetch() URLs, exactly
    # like the existing Drupal integration (ModelController) does.
    location /api/ {
        # Keep in sync with WORKER_MAX_UPLOAD_BYTES (worker default: 100 MB);
        # nginx's own default of 1 MB would otherwise reject real uploads
        # before they ever reach the worker.
        client_max_body_size 100m;
        proxy_pass $worker_upstream;
        proxy_set_header Host $host;
        # Lets the worker mark its session cookie Secure behind an HTTPS
        # terminator (see docker/host-nginx.example.conf).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Client IP for the worker's per-IP upload limits (accounts off) -
        # see WORKER_TRUSTED_PROXIES in worker/README.md.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The worker downloads the model before it answers (worker/remote_fetch.py,
    # at most 80 s) - longer than nginx's default 60 s.
    location = /api/model/create-from-url {
        proxy_pass $worker_upstream;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache-Control for browsers and Cloudflare comes from the worker
    # (Handler._serve_file) and is passed through unchanged. nginx's own copy
    # ignores it and is revalidated after a second (If-Modified-Since -> a
    # 304 that only stats the file): a deleted model answers 404 right away,
    # so Cloudflare, purged on delete, can never re-fetch it from here.
    location /files/ {
        proxy_pass $worker_upstream;
        proxy_cache files;
        proxy_cache_valid 200 1s;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Rollup chunks are named by their content hash (rollup.config.js,
    # output.chunkFileNames) - a changed file is always a new URL.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.js(\.map)?$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry module and the stylesheets carry ?v=<BUILD_ID> (see
    # rollup.config.js's versionQuery), so each build gets fresh URLs. Without
    # the query they still have to be revalidated.
    location ~ ^/(dfg_3dviewer-module\.js|assets/css/.+\.css)$ {
        add_header Cache-Control $versioned_cache_control;
        try_files $uri =404;
    }

    # Vendored decoders (draco, basis, web-ifc), fonts, images, maps and the
    # bundled example models: not hashed, but they only change with a library
    # upgrade - a week, then a background revalidation.
    location ~ ^/(assets/|examples/) {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # HTML, viewer-settings.json and manifests/ change without a new URL (the
    # Docker entrypoint and admins edit them): always revalidate - nginx's
    # ETag/Last-Modified make that a cheap 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

map $arg_v $versioned_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}
