server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied to the worker container by Docker Compose's service-name DNS
    # (see docker-compose.yml) - same-origin so viewer/status-poller.js and
    # viewer/ui/upload-panel.js can use plain relative fetch() URLs, exactly
    # like the existing Drupal integration (ModelController) does.
    location /api/ {
        # Keep in sync with WORKER_MAX_UPLOAD_BYTES (worker default: 100 MB);
        # nginx's own default of 1 MB would otherwise reject real uploads
        # before they ever reach the worker.
        client_max_body_size 100m;
        proxy_pass http://worker:8080/api/;
        proxy_set_header Host $host;
        # Lets the worker mark its session cookie Secure behind an HTTPS
        # terminator (see docker/host-nginx.example.conf).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /files/ {
        proxy_pass http://worker:8080/files/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
