server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the worker through Docker's embedded DNS at request time instead
    # of once at startup: a static `proxy_pass http://worker:8080` makes nginx
    # refuse to start ("host not found in upstream") whenever the worker
    # container is down or restarting. With a variable the viewer still
    # serves and only /api/ and /files/ answer 502 until the worker is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $worker_upstream http://worker:8080;

    # Proxied to the worker container by Docker Compose's service-name DNS
    # (see docker-compose.yml) - same-origin so viewer/status-poller.js and
    # viewer/ui/upload-panel.js can use plain relative fetch() URLs, exactly
    # like the existing Drupal integration (ModelController) does.
    location /api/ {
        # Keep in sync with WORKER_MAX_UPLOAD_BYTES (worker default: 100 MB);
        # nginx's own default of 1 MB would otherwise reject real uploads
        # before they ever reach the worker.
        client_max_body_size 100m;
        proxy_pass $worker_upstream;
        proxy_set_header Host $host;
        # Lets the worker mark its session cookie Secure behind an HTTPS
        # terminator (see docker/host-nginx.example.conf).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Client IP for the worker's per-IP upload limits (accounts off) -
        # see WORKER_TRUSTED_PROXIES in worker/README.md.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /files/ {
        proxy_pass $worker_upstream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
