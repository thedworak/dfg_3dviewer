# Local copy of the worker's /files/ (converted models, thumbnails): a
# Cloudflare miss - every edge location misses once - is served from here
# instead of the worker reading the whole file again. Each viewer container
# keeps its own; lost when the container is recreated.
proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=files:10m
                 max_size=2g inactive=7d use_temp_path=off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects (/exadmin -> Location: /exadmin/): an absolute one
    # carries this container's own scheme and port (http://<host>:3000/...),
    # which the host's nginx and Cloudflare in front do not serve.
    absolute_redirect off;

    # nginx's mime.types has no glTF: examples/*.glb would go out as
    # application/octet-stream. A server-level `types` replaces the inherited
    # map, hence mime.types again first; the two blocks merge.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    # Compresses origin -> Cloudflare traffic too (Cloudflare re-compresses
    # for visitors as it likes). Models are binary or already compressed
    # (Draco, LAZ) and stay as they are. The build's code comes compressed
    # already (scripts/precompress.mjs, in Dockerfile.viewer): its .gz copies
    # here (gzip_static), its .br copies below; on the fly only the rest.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/wasm
               image/svg+xml text/plain text/xml application/xml;

    # Brotli without a module: a client that accepts it gets the file's .br
    # copy, when the build made one (scripts/precompress.mjs: scripts,
    # stylesheets, WebAssembly, SVG), through the internal location below.
    # Here, before a location is chosen, so the Cache-Control of the file's
    # own location ($static_cache_control) still applies. An empty
    # $brotli_candidate tests "<root>.br", which does not exist.
    if (-f $document_root$brotli_candidate.br) {
        rewrite ^ $brotli_candidate.br last;
    }

    # Resolve the worker through Docker's embedded DNS at request time instead
    # of once at startup: a static `proxy_pass http://worker:8080` makes nginx
    # refuse to start ("host not found in upstream") whenever the worker
    # container is down or restarting. With a variable the viewer still
    # serves and only /api/ and /files/ answer 502 until the worker is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $worker_upstream http://worker:8080;

    # Proxied to the worker container by Docker Compose's service-name DNS
    # (see docker-compose.yml) - same-origin so viewer/status-poller.js and
    # viewer/ui/upload-panel.js can use plain relative fetch() URLs, exactly
    # like the existing Drupal integration (ModelController) does.
    location /api/ {
        # Keep in sync with WORKER_MAX_UPLOAD_BYTES (worker default: 300 MB);
        # nginx's own default of 1 MB would otherwise reject real uploads
        # before they ever reach the worker.
        client_max_body_size 300m;
        proxy_pass $worker_upstream;
        proxy_set_header Host $host;
        # Lets the worker mark its session cookie Secure behind an HTTPS
        # terminator (see docker/host-nginx.example.conf).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Client IP for the worker's per-IP upload limits (accounts off) -
        # see WORKER_TRUSTED_PROXIES in worker/README.md.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Pieces of an upload (viewer/ui/upload-panel.js, 16 MB each by default):
    # streamed to the worker as they come instead of first written to disk
    # here, one step less before the next piece is taken.
    location ^~ /api/model/upload/ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_pass $worker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The worker downloads the model before it answers (worker/remote_fetch.py,
    # at most 80 s) - longer than nginx's default 60 s.
    location = /api/model/create-from-url {
        proxy_pass $worker_upstream;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Your own Overpass API (docker-compose.yml, profile "overpass"): the
    # water of the generated surroundings. A variable, as for the worker: the
    # viewer serves without it, and this answers 502 until it is up - the
    # viewer then asks the public server (viewer.surroundings.mapUrl).
    location /overpass/ {
        set $overpass_upstream http://overpass:80;
        rewrite ^/overpass/(.*)$ /$1 break;
        proxy_pass $overpass_upstream;
        proxy_read_timeout 70s;
        proxy_set_header Host $host;
    }

    # One Claude request (worker/ai.py, WORKER_AI_TIMEOUT 90 s) - longer than
    # nginx's default 60 s; Cloudflare in front gives up at 100 s.
    location /api/ai/ {
        # An old map's picture (old-map): a few megabytes.
        client_max_body_size 16m;
        proxy_pass $worker_upstream;
        proxy_read_timeout 100s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache-Control for browsers and Cloudflare comes from the worker
    # (Handler._serve_file) and is passed through unchanged. nginx's own copy
    # ignores it and is revalidated after a second (If-Modified-Since -> a
    # 304 that only stats the file): a deleted model answers 404 right away,
    # so Cloudflare, purged on delete, can never re-fetch it from here.
    location /files/ {
        proxy_pass $worker_upstream;
        proxy_cache files;
        proxy_cache_valid 200 1s;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Potree 2 point clouds are read from one octree.bin by byte ranges
    # (worker/static_files.py), which may be gigabytes: with the cache above,
    # nginx would drop the Range header and copy the whole file from the
    # worker before answering the first range. Here it is fetched and cached
    # in 1 MB slices instead (ngx_http_slice_module, in the official image).
    # The same for the .rad trees of Gaussian splats, paged by Spark
    # (viewer/splats.js).
    location ~ ^/files/.+(/octree\.bin|\.rad)$ {
        slice 1m;
        proxy_pass $worker_upstream;
        proxy_set_header Range $slice_range;
        proxy_cache files;
        proxy_cache_key $uri$is_args$args$slice_range;
        proxy_cache_valid 200 206 1s;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # The viewer's own files. Their Cache-Control: $static_cache_control
    # (the map at the end of this file).
    location / {
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ =404;
    }

    # The .br copies, reached only through the rewrite above: their type is
    # the file's own, not ".br"; gzip off, or nginx would gzip them again.
    location ~ "\.(js|mjs|css|wasm|svg)\.br$" {
        internal;
        gzip off;
        add_header Content-Encoding br;
        add_header Vary Accept-Encoding;
        add_header Cache-Control $static_cache_control;
        types { }
        location ~ "\.m?js\.br$" { default_type application/javascript; }
        location ~ "\.css\.br$"  { default_type text/css; }
        location ~ "\.wasm\.br$" { default_type application/wasm; }
        location ~ "\.svg\.br$"  { default_type image/svg+xml; }
    }
}

# Cache-Control of the viewer's own files, by path (with or without the .br
# of a precompressed copy) and ?v=. The first pattern that matches wins.
map "$uri?$arg_v" $static_cache_control {
    # Rollup chunks are named by their content hash (rollup.config.js,
    # output.chunkFileNames; the ultralight viewer's in assets/ultra/) - a
    # changed file is always a new URL.
    "~^/assets/(ultra/)?[^/]+-[A-Za-z0-9_-]{8}\.js(\.map)?(\.br)?\?"  "public, max-age=31536000, immutable";
    # The entry modules and the stylesheets carry ?v=<BUILD_ID> (see
    # rollup.config.js's versionQuery), so each build gets fresh URLs. Without
    # the query they still have to be revalidated.
    "~^/(dfg_3dviewer-module|ultra|intro)\.js(\.br)?\?."  "public, max-age=31536000, immutable";
    "~^/assets/css/.+\.css(\.br)?\?."                    "public, max-age=31536000, immutable";
    # The example list (viewer/example-models.js) is fetched again at runtime
    # so a new example shows up without a release - like manifests/, always
    # revalidate, or Cloudflare keeps serving the old list for a week.
    "~^/examples/index\.json\?"                           "no-cache";
    # The example models and point clouds, and the intro's model data
    # (assets/intro/: its points, its time travel's textures): rebuilt under
    # the same names (scripts/build-pagoda-examples.mjs, a point cloud's
    # tiles r.pnts, r0.pnts...), so a week's copy mixed old and new - an
    # old, far denser point cloud under a new tileset, the old pagoda in the
    # intro. Always revalidate: a cheap 304 while they are unchanged.
    "~^/(examples|assets/intro)/"                          "no-cache";
    # Vendored decoders (draco, basis, web-ifc), fonts, images and maps: not
    # hashed, but they only change with a library upgrade - a week, then a
    # background revalidation.
    "~^/assets/"                                           "public, max-age=604800, stale-while-revalidate=86400";
    # HTML, viewer-settings.json and manifests/ change without a new URL (the
    # Docker entrypoint and admins edit them): always revalidate - nginx's
    # ETag/Last-Modified make that a cheap 304.
    default                                                "no-cache";
}

# The file whose .br copy to look for (the rewrite in the server block): the
# path of a script, stylesheet, WebAssembly or SVG, when the client accepts
# Brotli ("br" in Accept-Encoding, not with q=0); otherwise empty.
map $http_accept_encoding $accepts_brotli {
    default                          0;
    "~*(^|,)\s*br\s*;\s*q=0(\.0*)?\s*(,|$)"  0;
    "~*(^|,)\s*br\s*(;|,|$)"         1;
}
map "$accepts_brotli$uri" $brotli_candidate {
    default                                    "";
    "~^1(?<path>/.+\.(js|mjs|css|wasm|svg))$"  $path;
}
