services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - worker-jobs:/data/jobs
    environment:
      # CPU (default), GPU, or AUTO - see worker/README.md. GPU/AUTO also
      # need the reservation block below uncommented, plus
      # nvidia-container-toolkit installed on the host.
      - WORKER_RENDER_DEVICE=AUTO
      # Upload cap in bytes (100 MB). Keep in sync with client_max_body_size
      # in docker/nginx.conf.
      - WORKER_MAX_UPLOAD_BYTES=104857600
      # Optional accounts - off by default. Set these in a .env file next to
      # this compose file (or the shell), not here; see "Accounts" in
      # worker/README.md. WORKER_AUTH_MODE=required makes uploading/deleting
      # need a login; registration is open | approval | closed.
      - WORKER_AUTH_MODE=${WORKER_AUTH_MODE:-off}
      - WORKER_AUTH_REGISTRATION=${WORKER_AUTH_REGISTRATION:-approval}
      - WORKER_ADMIN_USER=${WORKER_ADMIN_USER:-}
      - WORKER_ADMIN_PASSWORD=${WORKER_ADMIN_PASSWORD:-}
    # Requesting this reservation without nvidia-container-toolkit on the
    # host makes `docker compose up` fail outright ("could not select
    # device driver \"nvidia\"") before the container ever starts, so it
    # stays commented out here - enable it per-machine via
    # docker-compose.override.yml instead (see
    # docker-compose.override.example.yml) rather than editing this file.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  # Each viewer service takes its settings from an AIM3D manifest profile
  # (VIEWER_PROFILE -> docker/profiles/<profile>.manifest.json), edited in the
  # settings volume after first start.
  #
  # Three viewer services, one per npm build target you'd otherwise run
  # locally via `npm run dev:test` / `dev:dev` / `dev:prod` - see "Standalone
  # Docker setup" in README.md. All three reverse-proxy /api/ and /files/ to
  # the same `worker` service (see docker/nginx.conf), so any of them can
  # drive the "Upload & convert" panel identically.
  viewer-test:
    build:
      context: .
      dockerfile: Dockerfile.viewer
      args:
        BUILD_TARGET: test
        VIEWER_PROFILE: ${VIEWER_PROFILE:-test}
    ports:
      - "3000:3000"
    volumes:
      # Named volumes can only be mounted as directories, not onto a single
      # file - docker/viewer-entrypoint.d/10-persist-viewer-settings.sh
      # seeds this directory from the image's built-in viewer-settings.json
      # on first run, then symlinks viewer-settings.json to it on every
      # start, so edits survive `docker compose up --build`.
      - viewer-test-settings:/data/viewer-config
    depends_on:
      - worker
    restart: unless-stopped

  viewer-dev:
    build:
      context: .
      dockerfile: Dockerfile.viewer
      args:
        BUILD_TARGET: dev
        VIEWER_PROFILE: ${VIEWER_PROFILE:-dev}
    ports:
      - "3001:3000"
    volumes:
      - viewer-dev-settings:/data/viewer-config
    depends_on:
      - worker
    restart: unless-stopped

  # Same "test" build as viewer-test, but its profile manifest
  # (docker/profiles/sandbox.manifest.json) sets viewer.sandbox=true
  # (drag-and-drop model upload, see viewer/sandbox.js) so opening this one's
  # root URL lands in sandbox mode without needing to append ?sandbox=1.
  viewer-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.viewer
      args:
        BUILD_TARGET: test
        VIEWER_PROFILE: ${VIEWER_PROFILE:-sandbox}
    ports:
      - "3002:3000"
    volumes:
      - viewer-sandbox-settings:/data/viewer-config
    depends_on:
      - worker
    restart: unless-stopped

volumes:
  worker-jobs:
  viewer-test-settings:
  viewer-dev-settings:
  viewer-sandbox-settings:
