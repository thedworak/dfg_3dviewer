apply plugin: 'com.android.application'

// versionCode lives in version.properties, raised by scripts/build-android-release.sh.
def versionProps = new Properties()
def versionFile = file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}

android {
    namespace = "com.thedworak.explora4d"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.thedworak.explora4d"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((versionProps['VERSION_CODE'] ?: '1') as Integer)
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // AdMob app id (AndroidManifest.xml). Google's test app by default;
        // release builds pass theirs: ./gradlew bundleRelease -PadmobAppId=ca-app-pub-...~...
        manifestPlaceholders = [admobAppId: project.findProperty('admobAppId') ?: 'ca-app-pub-3940256099942544~3347511713']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload key for Google Play, from ~/.gradle/gradle.properties (outside
    // the repo - never commit the keystore or its passwords):
    //   EXPLORA_UPLOAD_STORE_FILE=/home/you/keys/explora-upload.jks
    //   EXPLORA_UPLOAD_STORE_PASSWORD=...
    //   EXPLORA_UPLOAD_KEY_ALIAS=upload
    //   EXPLORA_UPLOAD_KEY_PASSWORD=...
    // Without them release builds come out unsigned (see docs/publishing.md).
    def uploadStoreFile = project.findProperty('EXPLORA_UPLOAD_STORE_FILE')
    signingConfigs {
        if (uploadStoreFile) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword project.findProperty('EXPLORA_UPLOAD_STORE_PASSWORD')
                keyAlias project.findProperty('EXPLORA_UPLOAD_KEY_ALIAS')
                keyPassword project.findProperty('EXPLORA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStoreFile) {
                signingConfig signingConfigs.upload
            }
            // R8: shrinks, optimizes and obfuscates the code (Play Console,
            // "DEX optimization"), and drops resources nothing references.
            // The plugins bring their own keep rules (Capacitor's keeps every
            // plugin class and @PluginMethod); the mapping file goes into the
            // bundle, so Play de-obfuscates crash and ANR reports by itself.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
