<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // ?ultralight=1 (or ultra=1): the ultralight viewer, ultra.html - the
      // model and nothing else - with the same parameters. Checked first, so
      // that neither the stylesheets nor the viewer's module are fetched.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var value = params.has("ultralight") ? params.get("ultralight") : params.get("ultra");
        if (["", "1", "true", "yes", "on"].indexOf(String(value).toLowerCase()) < 0) return;
        params.delete("ultralight");
        params.delete("ultra");
        window.location.replace("ultra.html?" + params.toString() + window.location.hash);
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DFG 3D Viewer Embed</title>
    <script>
      (function () {
        const value = new URLSearchParams(window.location.search).get("presentationMode");
        const isPresentationMode = ["1", "true", "yes", "on"].includes(String(value).toLowerCase());
        if (isPresentationMode) {
          document.documentElement.classList.add("presentation-mode");
        }
      })();
    </script>
    <link rel="shortcut icon" href="assets/img/dfgviewerFavicon.png" type="image/png">
    <link href="assets/css/main.css?v=2ef97741" rel="stylesheet" />
    <link href="assets/css/spinner.css?v=2ef97741" rel="stylesheet" />
    <link href="assets/css/theme.css?v=2ef97741" rel="stylesheet" />
    <link href="assets/css/external-sources.css?v=2ef97741" rel="stylesheet"/>
    <link href="assets/css/credits.css?v=2ef97741" rel="stylesheet"/>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The viewer fills what is left of the screen below anything shown
         above it (the local example picker), so its toolbar stays on screen;
         dvh follows a mobile browser's address bar. */
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      #DFG_3DViewer {
        width: 100%;
        flex: 1 1 0;
        min-height: 240px;
      }
    </style>
  </head>
  <body class="viewer-embed-page">
    <div id="DFG_3DViewer"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const hasExplicitSource = params.has("model") || params.has("src") || params.has("id");
        if (hasExplicitSource) return;

        const isLocalPreviewHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        if (!isLocalPreviewHost) return;

        const container = document.getElementById("DFG_3DViewer");
        if (!container || container.hasAttribute("3d")) return;
        container.setAttribute("3d", "./examples/box.stl");
      })();
    </script>
    <script type="module" src="dfg_3dviewer-module.js?v=2ef97741"></script>
  </body>
</html>
