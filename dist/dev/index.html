<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // ?ultralight=1 (or ultra=1): the ultralight viewer, ultra.html - the
      // model and nothing else - with the same parameters. Checked first, so
      // that neither the stylesheets nor the viewer's module are fetched.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var value = params.has("ultralight") ? params.get("ultralight") : params.get("ultra");
        if (["", "1", "true", "yes", "on"].indexOf(String(value).toLowerCase()) < 0) return;
        params.delete("ultralight");
        params.delete("ultra");
        window.location.replace("ultra.html?" + params.toString() + window.location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The viewer has its own dark theme: the browser does not darken the page
         by itself (Chrome's automatic dark mode dimmed the header's icons). -->
    <meta name="color-scheme" content="light dark" />
    <title>ExPlora4D Viewer (production environment)</title>
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/png">
    <link href="assets/css/main.css?v=e2ea1b53" rel="stylesheet" />
    <link href="assets/css/spinner.css?v=e2ea1b53" rel="stylesheet" />
    <link href="assets/css/theme.css?v=e2ea1b53" rel="stylesheet" />
    <link href="assets/css/external-sources.css?v=e2ea1b53" rel="stylesheet"/>
    <link href="assets/css/credits.css?v=e2ea1b53" rel="stylesheet"/>
  </head>
  <body class="viewer-standalone-page">
    <!-- Local example picker (left) and the account area (right): sign-in
         and user management are not part of choosing a model. -->
    <div id="viewer-page-header">
      <div id="example-model-picker">
        <!-- The scenes - the example AIM3D/IIIF manifests, the main content -
             first in the row (viewer/ui/examples-panel.js). -->
        <button type="button" id="browseManifestsButton"></button>
        <label for="example-model-select">Models</label>
        <!-- Options: the example list, examples/index.json (viewer/example-models.js). -->
        <select id="example-model-select">
          <button><selectedcontent></selectedcontent></button>
        </select>
        <button type="button" id="example-theme-toggle" title="Toggle dark mode">🌙</button>
        <button type="button" id="uploadModel"></button>
        <button type="button" id="browseModelsButton"></button>
        <button type="button" id="openLocalFileButton"></button>
      </div>
      <div id="viewer-account-bar">
        <button type="button" id="loginButton" hidden></button>
        <button type="button" id="manageUsersButton" hidden></button>
      </div>
    </div>
    <!--For in-built examples use one of the following 3d="./examples/tempietto/Tempietto.obj"
        OR
        USE external samples:
    3d="https://3d-repository.hs-mainz.de/sites/default/files/2024-01/gltf/test2.glb"
    3d="https://raw.githubusercontent.com/IIIF/3d/main/assets/astronaut/astronaut.glb"-->
    <div
      id="DFG_3DViewer"
      3d="./examples/tempietto/Tempietto.glb"
      style="height: 50vh"
    >
  </div>
    <script type="module" src="dfg_3dviewer-module.js?v=e2ea1b53"></script>
  </body>
</html>
