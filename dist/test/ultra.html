<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The viewer has its own dark theme: the browser does not darken the page
         by itself (Chrome's automatic dark mode dimmed the header's icons). -->
    <meta name="color-scheme" content="light dark" />
    <title>3D Viewer</title>
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/png">
    <!-- The ultralight viewer: the model and nothing else (viewer/ultra.js). -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { height: 100dvh; background: radial-gradient(circle, #ffffff 0%, #999999 100%); }
      #viewer { position: relative; width: 100%; height: 100%; }
      #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #progress {
        position: fixed; top: 0; left: 0; width: 100%; height: 3px;
        background: #3b82f6; transform: scaleX(0); transform-origin: left;
        transition: transform 0.2s;
      }
      .error {
        position: absolute; inset: auto 16px 16px; margin: 0; padding: 10px 14px;
        font: 14px/1.4 system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, 0.7);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="progress"></div>
    <script type="module" src="ultra.js?v=8694cfa1"></script>
  </body>
</html>
