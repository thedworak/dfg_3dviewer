<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ExPlora4D</title>
    <meta name="description" content="ExPlora4D - a 3D/4D viewer for cultural heritage. A cloud of points gathers into the Wołpa Synagogue." />
    <meta name="theme-color" content="#05070d" />
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/png">
    <link href="assets/intro/intro.css?v=1f676ab5" rel="stylesheet" />
  </head>
  <body>
    <!-- The intro (viewer/intro/intro.js): a cloud of points gathering into
         the Wolpa Synagogue, then a link into the viewer (?next=). -->
    <main id="intro">
      <canvas id="intro-canvas" aria-hidden="true"></canvas>
      <div class="intro-vignette" aria-hidden="true"></div>

      <!-- Sound (viewer/intro/intro-sound.js): off until switched on; a
           browser starts it only after a click or key press anyway. -->
      <button type="button" id="intro-sound" class="intro-sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" />
          <g class="intro-sound-waves" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M15.2 9.2a4 4 0 0 1 0 5.6" />
            <path d="M17.6 6.8a7.4 7.4 0 0 1 0 10.4" />
          </g>
          <g class="intro-sound-off" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
          </g>
        </svg>
      </button>

      <header class="intro-header">
        <h1 class="intro-logo">
          <img src="assets/img/logo/ExPlora4D-on-dark.webp" alt="ExPlora4D" width="2041" height="771" />
        </h1>
        <p id="intro-tagline" class="intro-tagline"></p>
      </header>

      <div class="intro-actions">
        <a id="intro-enter" class="intro-enter" href="./"></a>
        <p id="intro-caption" class="intro-caption"></p>
      </div>

      <footer class="intro-footer">
        <p id="intro-counter" class="intro-counter" aria-live="off"></p>
        <p id="intro-hint" class="intro-hint"></p>
        <button type="button" id="intro-replay" class="intro-replay"></button>
        <a id="intro-skip" class="intro-skip" href="./"></a>
      </footer>

      <p id="intro-status" class="intro-status" role="status"></p>
    </main>
    <script type="module" src="intro.js?v=1f676ab5"></script>
  </body>
</html>
