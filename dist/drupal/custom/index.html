<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DLF DFG 3D Viewer testing environment</title>
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/png">
    <link href="assets/css/main.css?v=398a93b5" rel="stylesheet" />
    <link href="assets/css/spinner.css?v=398a93b5" rel="stylesheet" />
    <link href="assets/css/theme.css?v=398a93b5" rel="stylesheet" />
    <link href="assets/css/external-sources.css?v=398a93b5" rel="stylesheet"/>
    <link href="assets/css/credits.css?v=398a93b5" rel="stylesheet"/>
  </head>
  <body class="viewer-standalone-page">
    <!-- Local example picker (left) and the account area (right): sign-in
         and user management are not part of choosing a model. -->
    <div id="viewer-page-header">
      <div id="example-model-picker">
        <label for="example-model-select">Load example model</label>
        <select id="example-model-select">
          <button><selectedcontent></selectedcontent></button>
          <option value="./examples/tempietto/Tempietto.dae">DAE</option>
          <option value="./examples/tempietto/Tempietto.stl">STL</option>
          <option value="./examples/tempietto/Tempietto.ply">PLY</option>
          <option value="./examples/tempietto/Tempietto.obj">OBJ</option>
          <option value="./examples/tempietto/Tempietto.xyz">XYZ</option>
          <option value="./examples/tempietto/Tempietto.pcd">PCD</option>
          <option value="./examples/tempietto/Tempietto.3ds">3DS</option>
          <option value="./examples/tempietto/Tempietto.ifc">IFC</option>
          <option value="./examples/tempietto/Tempietto.fbx">FBX</option>
          <option value="./examples/tempietto/Tempietto.glb" selected>GLB</option>
          <option value="./examples/tempietto/Tempietto.usdz">USDZ</option>
          <option value="./examples/tempietto/Tempietto.usda">USDA</option>
          <option value="./examples/tempietto/Tempietto.3mf">3MF</option>
          <option value="./examples/tempietto/Tempietto.amf">AMF</option>
          <option value="./examples/tempietto/Tempietto.wrl">WRL (VRML)</option>
          <option value="./examples/tempietto/Tempietto.kmz">KMZ</option>
          <option value="./examples/tempietto/Tempietto.vox">VOX</option>
          <option value="./examples/box-missing-mtl.obj">OBJ (missing MTL)</option>
          <option value="./examples/broken.glb">Broken GLB</option>
          <option value="./examples/WolpaSynagogue.glb">Wolpa Synagogue</option>
          <option value="./examples/WolpaSynagogue-progressive.glb">Wolpa Synagogue (progressive, Meshopt + KTX2)</option>
          <option value="./examples/tiles/wolpa-points/tileset.json">Wolpa Synagogue (point cloud, 3D Tiles)</option>
          <option value="./examples/points.laz">Point cloud (LAZ, UTM coordinates)</option>
          <option value="./examples/animated.glb">Animated GLB</option>
        </select>
        <button type="button" id="example-theme-toggle" title="Toggle dark mode">🌙</button>
        <button type="button" id="uploadModel"></button>
        <button type="button" id="browseModelsButton"></button>
        <button type="button" id="openLocalFileButton"></button>
      </div>
      <div id="viewer-account-bar">
        <button type="button" id="loginButton" hidden></button>
        <button type="button" id="manageUsersButton" hidden></button>
      </div>
    </div>
    <!--For in-built examples use one of the following 3d="./examples/tempietto/Tempietto.obj"
        OR
        USE external samples:
    3d="https://3d-repository.hs-mainz.de/sites/default/files/2024-01/gltf/test2.glb"
    3d="https://raw.githubusercontent.com/IIIF/3d/main/assets/astronaut/astronaut.glb"-->
    <div
      id="DFG_3DViewer"
      3d="./examples/tempietto/Tempietto.glb"
      style="height: 50vh"
    >
  </div>
    <script type="module" src="dfg_3dviewer-module.js?v=398a93b5"></script>
  </body>
</html>
