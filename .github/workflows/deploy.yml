name: Build and deploy to remote server

on:
  push:
    branches:
      - main
      - stable-release
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build:prod

      # Build every image before touching the server, so a broken Dockerfile
      # (or profile manifest) fails here instead of mid-deploy on the host.
      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

  deploy:
    needs: build
    # Runs directly on the target server (see README/docs for the
    # self-hosted runner setup) instead of SSHing into it from a
    # GitHub-hosted runner - those have no fixed IP, so a firewall locked to
    # a single allowed IP can't admit them on port 22 (or any port).
    runs-on: self-hosted
    steps:
      - name: Resolve deploy path for branch
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=${{ vars.DEPLOY_PATH_MAIN }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ vars.DEPLOY_PATH_STABLE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        run: |
          set -e
          cd "${{ steps.path.outputs.path }}"
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          export BUILD_ID="$(git rev-parse --short HEAD)"
          docker compose up -d --build
          docker image prune -f

      # Last step: clear Cloudflare's cache, so visitors get the new build
      # right away. The token is checked first (tokens/verify), so a revoked
      # or mistyped one fails with a clear message rather than a failed purge.
      # Secrets: CF_API_TOKEN (Zone > Cache Purge permission), CF_ACCOUNT_ID,
      # CF_ZONE_ID.
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -e
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::error::CF_API_TOKEN, CF_ACCOUNT_ID and CF_ZONE_ID must be set as repository secrets."
            exit 1
          fi

          verify="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")"
          if ! printf '%s' "$verify" | grep -q '"success":[[:space:]]*true'; then
            echo "::error::Cloudflare token verification failed: $verify"
            exit 1
          fi

          purge="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          if ! printf '%s' "$purge" | grep -q '"success":[[:space:]]*true'; then
            echo "::error::Cloudflare cache purge failed: $purge"
            exit 1
          fi
          echo "Cloudflare cache purged."
