name: Playwright Tests

# On pull requests to main (stable-release -> main): the checks of the pull
# request. Pushes do not run it - stable-release deploys untested, and main
# deploys the merge without testing again (deploy.yml finds this run of the
# pull request's head commit; without one it calls this workflow itself,
# workflow_call).
#
# A push to a pull request runs the tests tagged @smoke (tests/viewer.spec.ts,
# about 2 minutes). The label "full-tests" on the pull request runs them all -
# added before merging, and kept for the pushes after it. A manual run and
# the deploy's own run are always the full suite.
#
# Not run for changes to files the viewer tests do not cover: docs, Markdown,
# the website, the app's docs, and the worker (worker-tests.yml runs its
# Python tests).
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/docs/**'
      - '**/*.md'
      - '**/website/**'
      - 'worker/**'
  workflow_call:
  workflow_dispatch:

jobs:
  e2e:
    # Labelling with anything but "full-tests" runs nothing.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-tests'
    name: e2e ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-tests')) && 'smoke' || 'full' }} (${{ matrix.shard }})
    # A new push to the pull request (or the full-tests label) cancels the
    # run for its previous commit; on the job, so that a skipped run (another
    # label) cancels nothing.
    concurrency:
      group: playwright-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    # Repository variables (Settings > Secrets and variables > Actions >
    # Variables), all optional - without them: GitHub's runners, 3 shards,
    # 1 worker each.
    #   PLAYWRIGHT_RUNS_ON  runner labels as JSON, e.g. ["self-hosted","tests"]
    #                       (never a self-hosted runner for a public repository)
    #   PLAYWRIGHT_SHARDS   shard numbers as JSON, e.g. [1] for one machine
    #   PLAYWRIGHT_WORKERS  parallel browsers per shard (playwright.config.js)
    runs-on: ${{ fromJSON(vars.PLAYWRIGHT_RUNS_ON || '"ubuntu-26.04"') }}

    # The tests are split across parallel runners; each one builds and runs
    # its share.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.PLAYWRIGHT_SHARDS || '[1, 2, 3]') }}

    steps:
       - name: Checkout repo
         uses: actions/checkout@v6
 
       # pnpm, the version pinned in package.json ("packageManager").
       - name: Setup pnpm
         uses: pnpm/action-setup@v6

       - name: Setup Node
         uses: actions/setup-node@v6
         with:
           node-version: 24
           cache: pnpm
 
       - name: Install dependencies
         run: pnpm install --frozen-lockfile
 
       # A self-hosted runner has the system libraries installed once
       # (sudo npx playwright install-deps chromium) - installing them needs
       # root, which it should not have.
       - name: Install Playwright browsers
         run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
 
       - name: Build test dist
         run: pnpm run build:test
 
       - name: Run Playwright tests
         run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-tests')) && '--grep @smoke' || '' }}
         env:
           CI: true
           PLAYWRIGHT_WORKERS: ${{ vars.PLAYWRIGHT_WORKERS || 1 }}
 
       - name: Upload Playwright report
         if: always()
         uses: actions/upload-artifact@v6
         with:
           name: playwright-report-${{ matrix.shard }}
           path: playwright-report/
           retention-days: 30
