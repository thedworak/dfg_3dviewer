name: Playwright Tests

# Once per commit: on the push to its branch. A pull request does not run the
# tests again - the run of its head commit is shown in the pull request's
# checks. deploy.yml calls this workflow itself (workflow_call) for a push to
# main/stable-release whose commit has no passing run yet, before deploying.
# Changes to the docs or Markdown files alone do not run it.
on:
  push:
    branches-ignore:
      - main
      - stable-release
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:
  workflow_dispatch:

# A new push to the branch cancels the run for the previous commit.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    # Repository variables (Settings > Secrets and variables > Actions >
    # Variables), all optional - without them: GitHub's runners, 3 shards,
    # 1 worker each.
    #   PLAYWRIGHT_RUNS_ON  runner labels as JSON, e.g. ["self-hosted","tests"]
    #                       (never a self-hosted runner for a public repository)
    #   PLAYWRIGHT_SHARDS   shard numbers as JSON, e.g. [1] for one machine
    #   PLAYWRIGHT_WORKERS  parallel browsers per shard (playwright.config.js)
    runs-on: ${{ fromJSON(vars.PLAYWRIGHT_RUNS_ON || '"ubuntu-26.04"') }}

    # The tests are split across parallel runners; each one builds and runs
    # its share.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.PLAYWRIGHT_SHARDS || '[1, 2, 3]') }}

    steps:
       - name: Checkout repo
         uses: actions/checkout@v6
 
       # pnpm, the version pinned in package.json ("packageManager").
       - name: Setup pnpm
         uses: pnpm/action-setup@v6

       - name: Setup Node
         uses: actions/setup-node@v6
         with:
           node-version: 24
           cache: pnpm
 
       - name: Install dependencies
         run: pnpm install --frozen-lockfile
 
       # A self-hosted runner has the system libraries installed once
       # (sudo npx playwright install-deps chromium) - installing them needs
       # root, which it should not have.
       - name: Install Playwright browsers
         run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
 
       - name: Build test dist
         run: pnpm run build:test
 
       - name: Run Playwright tests
         run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
         env:
           CI: true
           PLAYWRIGHT_WORKERS: ${{ vars.PLAYWRIGHT_WORKERS || 1 }}
 
       - name: Upload Playwright report
         if: always()
         uses: actions/upload-artifact@v6
         with:
           name: playwright-report-${{ matrix.shard }}
           path: playwright-report/
           retention-days: 30
