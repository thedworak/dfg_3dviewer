name: Playwright Tests

# Once per change: in its pull request. deploy.yml calls this workflow itself
# (workflow_call) for a push to main/stable-release that did not come from a
# pull request with passing tests, before deploying.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A new push to the pull request cancels the run for the previous commit.
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout repo
         uses: actions/checkout@v6
 
       # pnpm, the version pinned in package.json ("packageManager").
       - name: Setup pnpm
         uses: pnpm/action-setup@v6

       - name: Setup Node
         uses: actions/setup-node@v6
         with:
           node-version: 24
           cache: pnpm
 
       - name: Install dependencies
         run: pnpm install --frozen-lockfile
 
       - name: Install Playwright browsers
         run: pnpm exec playwright install --with-deps chromium
 
       - name: Build test dist
         run: pnpm run build:test
 
       - name: Run Playwright tests
         run: pnpm exec playwright test
         env:
           CI: true
 
       - name: Upload Playwright report
         if: always()
         uses: actions/upload-artifact@v6
         with:
           name: playwright-report
           path: playwright-report/
           retention-days: 30
