name: Build and release dist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm, the version pinned in package.json ("packageManager") - the
      # lockfile is pnpm-lock.yaml, with the overrides in pnpm-workspace.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build dist
        run: pnpm run build:all

      - name: Pack dist
        run: node ./scripts/pack-dist.js

      - name: Create release and upload dist zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./dfg_3dviewer-dist.zip
